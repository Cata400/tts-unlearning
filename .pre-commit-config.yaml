default_language_version:
  python: python3.11

repos:
  # Linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.13
    hooks:
      - id: ruff-check
        name: ruff linter
        args: [--fix]
      # - id: ruff-format
      #   name: ruff formatter
      # - id: ruff
      #   name: ruff sorter
      #   args: [--select, I, --fix]

  # Format code
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        args: [--line-length=120]

  # Sort imports
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Run pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key
      - id: check-added-large-files
      - id: mixed-line-ending

  # Delete unused variables and imports
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args: ["--in-place", "--recursive", "--remove-unused-variables", "--remove-all-unused-imports"]

  # # Show warnings for code standards not respected
  # - repo: https://github.com/pylint-dev/pylint
  #   rev: v4.0.4
  #   hooks:
  #     - id: pylint
  #       name: pylint
  #       entry: pylint
  #       language: python
  #       types: [python]
  #       args: [
  #         "--max-line-length=120",
  #         "--min-similarity-lines=10",
  #         "--max-attributes=10",
  #         "--max-locals=50",
  #         "--max-branches=50",
  #         "--max-statements=200",
  #         "--max-nested-blocks=10",
  #         "--max-returns=12",
  #         "--disable=E0401,E1120,R0903,E1102,C0103",
  #         "--fail-under=8",
  #       ]

default_stages:
  - pre-commit
