datasets:
  name: LibriTTS_100_train_intra_speaker_split_0.2
  batch_size_per_gpu: 4
  batch_size_type: unlearn_sample
  max_samples: 64
  num_workers: 16
optim:
  epochs: 1
  learning_rate: 1.0e-05
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: false
model:
  name: F5TTS_v1_Base
  tokenizer: pinyin
  tokenizer_path: null
  backbone: DiT
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: true
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: false
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos
  vocoder:
    is_local: false
    local_path: null
ckpts:
  logger: tensorboard
  log_samples: true
  save_per_updates: 10000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  save_dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}_oversample_1_epoch
  pretrained_path: /home/catalin.ciocirlan/phd/tts-unlearning/ckpts/pretrained/F5TTS_v1_Base/pretrained_model_1250000.safetensors
unlearn:
  random_seed: 42
  forget_speakers:
  - 196
  unlearn_methods:
    dont_mimic_my_voice:
      use: true
      lambda: 0.2
